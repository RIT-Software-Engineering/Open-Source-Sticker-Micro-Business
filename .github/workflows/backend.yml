name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'sticker-business/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'sticker-business/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify
        working-directory: sticker-business

  database:
    name: Database
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: sticker_business
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - name: Confirm MySQL is healthy
        run: echo "MySQL 8.4 is ready."
