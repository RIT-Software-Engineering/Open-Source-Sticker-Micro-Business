services:
  backend:
    build:
      context: ./sticker-business
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      
  database:
    image: mysql:8.4
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
      
volumes:
  mysql_data: